    <script>
        const paymentData = [
            { date: "2026-03-01", cash: 15250, bank: 28400, bdOffice: 8500, ksaOffice: 12300 },
            { date: "2026-03-02", cash: 0, bank: 15600, bdOffice: 4200, ksaOffice: 0 },
            { date: "2026-03-03", cash: 8500, bank: 0, bdOffice: 2100, ksaOffice: 6500 },
            { date: "2026-03-04", cash: 12300, bank: 35000, bdOffice: 15000, ksaOffice: 8000 },
            { date: "2026-03-05", cash: 5600, bank: 18500, bdOffice: 0, ksaOffice: 9200 },
            { date: "2026-03-08", cash: 28000, bank: 45000, bdOffice: 22500, ksaOffice: 18000 },
            { date: "2026-03-10", cash: 0, bank: 32000, bdOffice: 10000, ksaOffice: 0 },
            { date: "2026-03-12", cash: 18500, bank: 0, bdOffice: 7500, ksaOffice: 14500 },
            { date: "2026-03-15", cash: 45000, bank: 52000, bdOffice: 28000, ksaOffice: 22000 },
            { date: "2026-03-18", cash: 8200, bank: 25600, bdOffice: 0, ksaOffice: 16800 }
        ];

        let filteredData = [...paymentData];

        function formatCurrency(amount) {
            return amount.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' SAR';
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const day = String(date.getDate()).padStart(2, '0');
            const month = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][date.getMonth()];
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function getAmountClass(amount) {
            return amount > 0 ? 'amount-positive' : 'amount-zero';
        }

        function renderTable(data) {
            const tbody = document.getElementById('paymentTableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">No records found</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(row => `
                <tr class="table-row-payment">
                    <td class="px-4 py-3 text-sm text-center border-r border-gray-200 font-medium text-gray-700">${formatDate(row.date)}</td>
                    <td class="px-4 py-3 text-sm text-right border-r border-gray-200 ${getAmountClass(row.cash)}">${formatCurrency(row.cash)}</td>
                    <td class="px-4 py-3 text-sm text-right border-r border-gray-200 ${getAmountClass(row.bank)}">${formatCurrency(row.bank)}</td>
                    <td class="px-4 py-3 text-sm text-right border-r border-gray-200 ${getAmountClass(row.bdOffice)}">${formatCurrency(row.bdOffice)}</td>
                    <td class="px-4 py-3 text-sm text-right ${getAmountClass(row.ksaOffice)}">${formatCurrency(row.ksaOffice)}</td>
                </tr>
            `).join('');
        }

        function calculateTotals(data) {
            return data.reduce((acc, row) => ({
                cash: acc.cash + row.cash,
                bank: acc.bank + row.bank,
                bdOffice: acc.bdOffice + row.bdOffice,
                ksaOffice: acc.ksaOffice + row.ksaOffice
            }), { cash: 0, bank: 0, bdOffice: 0, ksaOffice: 0 });
        }

        function updateTotals(data) {
            const totals = calculateTotals(data);
            document.getElementById('totalCash').textContent = formatCurrency(totals.cash);
            document.getElementById('totalBank').textContent = formatCurrency(totals.bank);
            document.getElementById('totalBD').textContent = formatCurrency(totals.bdOffice);
            document.getElementById('totalKSA').textContent = formatCurrency(totals.ksaOffice);
        }

        function applyDateFilter() {
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;
            
            filteredData = paymentData.filter(row => {
                const rowDate = row.date;
                return (!fromDate || rowDate >= fromDate) && (!toDate || rowDate <= toDate);
            });
            
            renderTable(filteredData);
            updateTotals(filteredData);
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        function updateLastUpdated() {
            const now = new Date();
            const options = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('lastUpdated').textContent = now.toLocaleDateString('en-GB', options);
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderTable(filteredData);
            updateTotals(filteredData);
            updateLastUpdated();
        });
    </script>
