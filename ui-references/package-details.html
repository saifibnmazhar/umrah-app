    <script src="shared.js"></script>
    <script>
        let currentPackageIndex = null;
        let currentPackage = null;

        function loadAdminSettings() {
            const saved = localStorage.getItem('adminSettings');
            if (saved) {
                return JSON.parse(saved);
            }
            return { packageConfigs: [] };
        }

        function parseTicketDetails(ticketString) {
            if (!ticketString) return { route: '', airline: '', class: '' };
            const parts = ticketString.split(' - ');
            return {
                route: parts[0] || '',
                airline: parts[1] || '',
                class: parts[2] || ''
            };
        }

        function formatDate(dateStr) {
            if (!dateStr || dateStr === '') return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function renderPackageDetails() {
            const params = new URLSearchParams(window.location.search);
            const index = params.get('index');

            if (index === null) {
                document.getElementById('packageDetailsSection').classList.add('hidden');
                document.getElementById('packageNotFound').classList.remove('hidden');
                return;
            }

            const adminSettings = loadAdminSettings();
            const packages = adminSettings.packageConfigs || [];
            currentPackageIndex = parseInt(index);

            if (!packages[currentPackageIndex]) {
                document.getElementById('packageDetailsSection').classList.add('hidden');
                document.getElementById('packageNotFound').classList.remove('hidden');
                return;
            }

            currentPackage = packages[currentPackageIndex];
            const ticketDetails = parseTicketDetails(currentPackage.ticket);

            document.getElementById('packageName').textContent = currentPackage.packageName;

            const typeBadge = document.getElementById('packageTypeBadge');
            if (currentPackage.ticketType === 'Offer') {
                typeBadge.className = 'inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-700';
                typeBadge.textContent = 'Offer';
            } else if (currentPackage.ticketType === 'Group') {
                typeBadge.className = 'inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-purple-100 text-purple-700';
                typeBadge.textContent = 'Group';
            } else {
                typeBadge.className = 'inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-slate-100 text-slate-700';
                typeBadge.textContent = 'Regular';
            }

            document.getElementById('packageTicket').textContent = currentPackage.ticket || '-';
            document.getElementById('packageAvailable').textContent = currentPackage.ticketType === 'Group' ? (currentPackage.availableTicket || 0) + ' tickets' : '-';
            document.getElementById('packageEffectiveFrom').textContent = formatDate(currentPackage.effectiveFrom);
            document.getElementById('packageEffectiveTo').textContent = formatDate(currentPackage.effectiveTo);

            document.getElementById('packageRegularPrice').textContent = (currentPackage.regularPrice || 0).toLocaleString() + ' SAR';

            const offerSection = document.getElementById('offerPriceSection');
            if (currentPackage.ticketType === 'Offer' && currentPackage.offerPrice > 0) {
                offerSection.classList.remove('hidden');
                document.getElementById('packageOfferPrice').textContent = currentPackage.offerPrice.toLocaleString() + ' SAR';
            } else {
                offerSection.classList.add('hidden');
            }
        }

        function addBooking() {
            if (currentPackageIndex !== null) {
                window.location.href = 'booking.html?package=' + currentPackageIndex;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderPackageDetails();
        });
    </script>
