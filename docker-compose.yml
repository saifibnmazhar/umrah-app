name: ${COMPOSE_PROJECT_NAME:-umrah-app}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DB_TYPE=${DB_TYPE:-mysql}
    volumes:
      - storage_data:/var/www/html/storage
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped

  db:
    profiles: ["${DB_TYPE:-mysql}"]
    image: ${DB_IMAGE:-mysql:8.0}
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-umrah_app_dev}
      - MYSQL_USER=${DB_USERNAME:-umrah_app_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-dev_password}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-${DB_PASSWORD:-dev_password}}
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-3306}:3306"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -u${DB_USERNAME:-umrah_app_user} --password=${DB_PASSWORD:-dev_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data_dev:/var/lib/mysql
    restart: unless-stopped

  db-postgres:
    profiles: ["postgresql"]
    image: ${DB_IMAGE:-postgres:16-alpine}
    environment:
      - POSTGRES_DB=${DB_DATABASE:-umrah_app_dev}
      - POSTGRES_USER=${DB_USERNAME:-umrah_app_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-dev_password}
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-5432}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USERNAME:-umrah_app_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  mysql_data_dev:
  postgres_data_dev:
  storage_data:
