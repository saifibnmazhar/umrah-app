name: ${COMPOSE_PROJECT_NAME:-umrah-app}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME:-umrah_app_app}
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-umrah_app_dev}
      - DB_USERNAME=${DB_USERNAME:-umrah_app_user}
      - DB_PASSWORD=${DB_PASSWORD:-dev_password}
      - DB_CONNECTION=pgsql
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
    volumes:
      - storage_data:/var/www/html/storage
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME:-umrah_app_db_dev}
    environment:
      - POSTGRES_DB=${DB_DATABASE:-umrah_app_dev}
      - POSTGRES_USER=${DB_USERNAME:-umrah_app_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-dev_password}
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-5433}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-umrah_app_user} -d ${DB_DATABASE:-umrah_app_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres_data_dev:
  storage_data:
