; Application-level PHP overrides (applied on top of the base image's php.ini-production).
;
; The branch-statement report loads the full date-range dataset into memory
; (ServiceOrders + Vouchers with eager-loaded relations) and paginates in PHP,
; which blows the base image's default 128M limit on production data volumes.
; 512M is the tested ceiling for this report at current data size.
; NOTE: the durable fix is SQL-side pagination/aggregation in ReportController —
;       this override is the operational safety margin until that lands.
memory_limit = 512M

; The report also exceeds the stock 30s max_execution_time on full production
; data (date-casting during hydration). nginx fastcgi_read_timeout (see
; docker/nginx/conf.d/default.conf) must be >= this value or nginx kills the
; request first. 300s is a generous ceiling for a heavy report endpoint; the
; SQL-side refactor will bring this back down.
max_execution_time = 300
