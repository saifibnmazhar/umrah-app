[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# One-shot CSRF tripwire: runs at every container start so restarts that never
# run a deploy script (a server reboot, `docker restart`) are covered too, not
# just the deploy scripts. It waits for nginx itself (bounded), reports the
# result to `docker logs`, and is expected to exit - hence autorestart=false
# and startsecs=0 (count as started at once).
# A failure here must never affect the running application.
[program:csrf-probe]
command=/usr/local/bin/csrf-probe.sh
priority=30
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
