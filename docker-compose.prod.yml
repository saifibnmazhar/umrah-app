name: ${COMPOSE_PROJECT_NAME:-umrah-app}

services:
  app:
    image: ghcr.io/mostafiz-8bits/umrah-app:${IMAGE_TAG:-latest}
    env_file: .env.production
    volumes:
      - umrah_app_storage:/var/www/html/storage
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    labels:
      - com.centurylinklabs.watchtower=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  db:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME:-umrah_app_db}
    env_file: .env.production
    volumes:
      - umrah_app_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-umrah_app_redis}
    env_file: .env.production
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --pass \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

volumes:
  umrah_app_storage:
  umrah_app_pg_data:

networks:
  backend:
    driver: bridge
