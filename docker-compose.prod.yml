name: ${COMPOSE_PROJECT_NAME:-umrah-app}

services:
  app:
    image: ${APP_IMAGE}:${IMAGE_TAG:-latest}

    env_file:
      - .env.production

    volumes:
      - app_storage:/var/www/html/storage

    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"

    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

    labels:
      - com.centurylinklabs.watchtower=true

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    networks:
      - backend

  db:
    profiles: ["${DB_TYPE:-mysql}"]
    image: ${DB_IMAGE:-mysql:8.0}
    env_file:
      - .env.production
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot --password=$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  db-postgres:
    profiles: ["postgresql"]
    image: ${DB_IMAGE:-postgres:16-alpine}
    env_file:
      - .env.production
    environment:
      - POSTGRES_DB=${DB_DATABASE:-binmishal_umrah_live}
      - POSTGRES_USER=${DB_USERNAME:-binmishal_umrah}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-${MYSQL_PASSWORD:-}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USERNAME:-binmishal_umrah}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}

    env_file:
      - .env.production

    command:
      [
        "sh",
        "-c",
        'exec redis-server --requirepass "$${REDIS_PASSWORD}" --maxmemory ${REDIS_MAX_MEMORY:-128mb} --maxmemory-policy allkeys-lru',
      ]

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --pass "$${REDIS_PASSWORD}" ping | grep PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

    networks:
      - backend

volumes:
  app_storage:
  db_data:
  postgres_data:

networks:
  backend:
    driver: bridge
