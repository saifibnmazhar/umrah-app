name: ${COMPOSE_PROJECT_NAME:-umrah-binmishaltravels-com}

services:

  app:
    image: ${APP_IMAGE:-ghcr.io/saifibnmazhar/umrah-app}:${IMAGE_TAG:-latest}

    env_file:
      - .env.production

    volumes:
      - app_storage:/var/www/html/storage

    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Kept only because the copy running on the production server carries it.
    # Nothing runs Watchtower, so the label is inert.
    labels:
      - com.centurylinklabs.watchtower=true

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    networks:
      - backend


  db:
    image: ${DB_IMAGE:-mysql:8.0}

    env_file:
      - .env.production

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot --password=$${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      - backend


  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}

    env_file:
      - .env.production

    command:
      [
        "sh",
        "-c",
        "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --maxmemory ${REDIS_MAX_MEMORY:-128mb} --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec"
      ]

    # Sessions live in Redis (SESSION_DRIVER=redis), so an ephemeral Redis
    # means every restart logs every user out — and an in-flight POST then
    # fails with 419. Append-only mode plus this volume makes those keys
    # survive a restart, a redeploy and a host reboot.
    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --pass \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

    networks:
      - backend


volumes:
  app_storage:
  db_data:
  redis_data:


networks:
  backend:
    driver: bridge
