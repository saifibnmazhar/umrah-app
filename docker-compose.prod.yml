name: ${COMPOSE_PROJECT_NAME:-umrah-app}

services:
  app:
    image: ghcr.io/mostafiz-8bits/umrah-app:${IMAGE_TAG:-latest}
    env_file: .env.production
    volumes:
      - umrah_app_storage:/var/www/html/storage
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    labels:
      - com.centurylinklabs.watchtower=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  db:
    image: mysql:8.0
    container_name: ${DB_CONTAINER_NAME:-umrah_app_db}
    env_file: .env.production
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -u$${DB_USERNAME} --password=$${DB_PASSWORD} -d $${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-umrah_app_redis}
    env_file: .env.production
    command:
      [
        "sh",
        "-c",
        "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --maxmemory 128mb --maxmemory-policy allkeys-lru",
      ]
    healthcheck:
      test:
        ["CMD-SHELL", "redis-cli --pass \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

volumes:
  umrah_app_storage:
  umrah_app_mysql_data:

networks:
  backend:
    driver: bridge